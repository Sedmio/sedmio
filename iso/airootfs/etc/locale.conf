# Язык системных служб — C. Русский интерфейс задаётся сессии Plasma
# (~/.config/plasma-localerc), из неё же запускается установщик.
# Причина: kpmcore (разметка в Calamares) запускает sfdisk через системную
# службу и ищет в выводе английскую фразу «Script header accepted.».
# С русской локалью системы создание таблицы разделов «не удаётся».
LANG=C.UTF-8
