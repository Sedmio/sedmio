# Меню загрузки образа Sedmio (UEFI). Основа — releng/grub/grub.cfg из
# archiso; %ARCH%, %INSTALL_DIR%, %ARCHISO_UUID%, %KERNEL_PARAMS%
# подставляет mkarchiso. Тема — themes/sedmio (картинки рисует
# tools/boot-theme/render.py, шрифты делает scripts/build-iso.sh).

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Графический режим и тема. Если что-то не загрузится — обычное
# текстовое меню, загрузка всё равно работает.
set sedmio_theme="/boot/grub/themes/sedmio"
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod png
    set gfxmode="1920x1080,1600x900,auto"
    set gfxpayload=keep
    terminal_input console
    terminal_output gfxterm
    # Те же имена, что делает scripts/build-iso.sh и ждёт theme.txt
    for f in text-16 text-18 text-22 medium-22 bold-16 bold-56 mono-16 ; do
        loadfont "${sedmio_theme}/${f}.pf2"
    done
    if [ -e "${sedmio_theme}/theme.txt" ]; then
        set theme="${sedmio_theme}/theme.txt"
        # Правка параметров (E) и командная строка (C): тёмный текст на
        # светлом поле рамки темы. Фон black в color_* — «фон терминала»,
        # а его цвет задаёт background_color (иначе поле чёрное).
        insmod gfxterm_background
        background_color "#F8FAF5"
        set color_normal=black/black
        set color_highlight=white/dark-gray
    fi
fi

# Сообщения GRUB по-русски (locale/ru.mo кладёт scripts/build-iso.sh)
if [ -e "${prefix}/locale/ru.mo" ]; then
    set locale_dir="${prefix}/locale"
    set lang=ru
    insmod gettext
fi

# Платформа и тип UEFI для Memtest86+
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    fi
fi

default=sedmio
timeout=10
timeout_style=menu

menuentry "Запустить Sedmio" --class sedmio --id 'sedmio' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# Для видеокарт, с которыми не запускается графика: без смены
# видеорежима ядром (nomodeset), рабочий стол будет попроще и медленнее.
menuentry "Запустить Sedmio в простом видеорежиме" --class sedmio --id 'sedmio-nomodeset' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a -f "/boot/memtest86+/memtest86${uefi_machine_type_lower}.efi" ]; then
    menuentry "Проверить оперативную память" --class memtest {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest86${uefi_machine_type_lower}.efi
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    if fwsetup --is-supported; then
        menuentry "Настройки UEFI" --class efi --id 'uefi-firmware' {
            fwsetup
        }
    fi
fi

menuentry "Перезагрузить" --class reboot {
    reboot
}

menuentry "Выключить" --class shutdown {
    halt
}
