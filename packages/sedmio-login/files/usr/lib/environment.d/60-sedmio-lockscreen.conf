# Экран блокировки: kscreenlocker_greet (его запускает KWin) берёт вид
# из пакета Plasma/Shell по этой переменной — наш пакет org.sedmio.shell
# (usr/share/plasma/shells). Через plasmashellrc нельзя: тот же ключ
# читает plasmashell, а запасной режим с ним должен остаться рабочим
# (там переменная переопределена, см. plasma-plasmashell.service.d).
PLASMA_DEFAULT_SHELL=org.sedmio.shell
