# Программы KDE и Qt спрашивают файл через портал, а не своим окном KDE:
# тогда везде одно окно выбора — Sedmio (sedmio-files --portal).
PLASMA_INTEGRATION_USE_PORTAL=1
# То же для программ на GTK3 с GtkFileChooserNative (GTK4 ходит в портал сам).
# Программы со старым GtkFileChooserDialog (GIMP и т. п.) так и рисуют своё.
GTK_USE_PORTAL=1
