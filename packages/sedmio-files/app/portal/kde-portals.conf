# Порталы в сеансе Plasma — как в /usr/share/xdg-desktop-portal/kde-portals.conf
# (plasma-workspace), только окно выбора файлов — Sedmio («Файлы»,
# sedmio-files --portal). Пакета sedmio-files нет — нет и sedmio.portal,
# тогда берётся окно KDE. Вернуть окно KDE одному пользователю: тот же
# файл в ~/.config/xdg-desktop-portal/ без строки FileChooser.
# Обновилась plasma-workspace — сверить остальные строки с её файлом.
[preferred]
default=kde
org.freedesktop.impl.portal.FileChooser=sedmio;kde
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Notification=plasmanotify
