# Порталы в сеансе Sedmio (XDG_CURRENT_DESKTOP=KDE) — как было в
# kde-portals.conf из plasma-workspace, только окна выбора файла и
# «Открыть с помощью» — Sedmio («Файлы», sedmio-files --portal), а
# уведомления — через портал GTK (он отдаёт их org.freedesktop.Notifications,
# то есть оболочке): portal plasmanotify жил в plasmashell. Пакета
# sedmio-files нет — нет и sedmio.portal, тогда берутся окна KDE. Вернуть
# окна KDE одному пользователю: тот же файл в ~/.config/xdg-desktop-portal/
# без этих строк.
[preferred]
default=kde
org.freedesktop.impl.portal.FileChooser=sedmio;kde
org.freedesktop.impl.portal.AppChooser=sedmio;kde
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Notification=gtk
