# Calamares 3.4. Модули *q — QML-версии страниц, их вид лежит в
# branding/sedmio/<модуль>.qml (поиск qmlSearch: both — сначала branding).
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: sedmio
    module: shellprocess
    config: shellprocess_sedmio.conf

sequence:
  - show:
      - welcomeq
      - localeq
      - partition
      - usersq
      - summaryq
  # TODO: часть exec не проверена. Сначала нужен live-образ с Plasma,
  # который unpackfs копирует на диск. См. docs/installer.md.
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - localeq
      - localecfg
      - fstab
      - initcpiocfg
      - initcpio
      - usersq
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@sedmio
      - bootloader
      - umount
  - show:
      - finishedq

branding: sedmio

# Отдельного вопроса «Установить?» нет: его роль играет страница итога.
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
