# Calamares 3.4. Модули *q — QML-версии страниц, их вид лежит в
# branding/sedmio/<модуль>.qml (поиск qmlSearch: both — сначала branding).
#
# Установка по сети: после разметки pacstrap ставит на диск sedmio-base
# и профиль машины (свой модуль sedmiopacstrap — он же показывает ход),
# дальше стандартные модули настраивают установленную систему.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: sedmio
    module: shellprocess
    config: shellprocess_sedmio.conf
  - id: bootentries
    module: shellprocess
    config: shellprocess_bootentries.conf

sequence:
  - show:
      - welcomeq
      - localeq
      - partition
      - usersq
      - summaryq
  - exec:
      - partition
      - mount
      - sedmiopacstrap
      - machineid
      - localeq
      - localecfg
      - fstab
      - initcpiocfg
      - initcpio
      - usersq
      # displaymanager не нужен: экран входа (greetd) настроен пакетом sedmio-login
      - networkcfg
      - hwclock
      - shellprocess@sedmio
      - bootloader
      - shellprocess@bootentries
      - umount
  - show:
      - finishedq

branding: sedmio

# Отдельного вопроса «Установить?» нет: его роль играет страница итога.
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
