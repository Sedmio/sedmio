---
qmlSearch: both

defaultGroups:
  - users
  - video
  - audio
  - network
  - storage
  - wheel

sudoersGroup: wheel
autologinGroup: autologin
doAutologin: false

# Пароль пользователя используется и для root, отдельно его не спрашиваем.
setRootPassword: true
doReusePassword: true

passwordRequirements:
  minLength: 1
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /bin/bash
  forbidden_names: [ root ]

# Логин создаётся из имени автоматически (транслитерация ICU:
# «Иван» → ivan), имя компьютера — из логина.
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${login}-pc"
  forbidden_names: [ localhost ]
