# Установка пакетов на размеченный диск: pacstrap с live-системы.
# Ставится ровно состав Sedmio (sedmio-base + профиль машины), а не копия
# live-образа — поэтому чистить за live-сессией не нужно.
---
dontChroot: true
timeout: 3600
script:
  - command: "/usr/lib/sedmio/installer/pacstrap.sh ${ROOT}"
    timeout: 3600

# Это самый долгий шаг, а полоса хода всё это время стоит на месте:
# подпись говорит, что так и должно быть.
i18n:
  name: "Скачиваем и ставим программы — это самый долгий шаг, 5–15 минут"
