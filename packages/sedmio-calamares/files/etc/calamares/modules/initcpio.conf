# Пересборка initramfs после настройки mkinitcpio.conf (initcpiocfg).
# Ядер два — linux-cachyos и linux-lts, а пресета linux нет вовсе,
# поэтому все пресеты сразу (mkinitcpio -P). По умолчанию здесь «linux»,
# и установка падала: «Failed to load preset: /etc/mkinitcpio.d/linux.preset».
---
kernel: all
be_unsafe: false
