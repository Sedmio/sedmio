# Загрузчик: systemd-boot.
# Временный выбор для первой рабочей версии: прост и надёжен на UEFI
# (обе машины — UEFI). Красивый загрузчик — отдельный этап, см. docs/decisions.md.
#
# На каждое ядро из /usr/lib/modules (linux-cachyos, linux-lts) создаётся
# свой пункт меню и запасной (fallback).
---
efiBootLoader: "systemd-boot"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
loaderEntries:
  - "timeout 3"
  - "console-mode keep"
kernelParams: [ "quiet", "splash" ]
efiBootMgr: "efibootmgr"
installEFIFallback: true

# Не используются при systemd-boot, но модуль их читает.
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
