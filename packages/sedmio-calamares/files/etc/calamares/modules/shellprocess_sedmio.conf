# Доводка установленной системы под Sedmio.
# Скрипт живёт в live-образе, поэтому запускается снаружи (dontChroot)
# и сам заходит в целевую систему через arch-chroot.
---
dontChroot: true
timeout: 1800
script:
  - "/usr/lib/sedmio/installer/postinstall.sh ${ROOT}"
i18n:
  name: "Последние настройки системы"
