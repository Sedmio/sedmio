# Разметка диска.
# Загрузчик — systemd-boot, ему нужны ядра на разделе EFI, поэтому
# раздел EFI монтируется в /boot и делается с запасом на два ядра.
---
efi:
  mountPoint: "/boot"
  recommendedSize: 1GiB
  minimumSize: 512MiB
  label: "EFI"

# Подкачка — без раздела; zram настроим отдельно.
userSwapChoices:
  - none
  - file
initialSwapChoice: none

luksGeneration: luks2
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase

# btrfs: сжатие и подтома (@, @home, @cache, @log) — см. mount.conf по умолчанию.
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]

essentialMounts: [ "live-*", "control", "ventoy" ]

# Раздел системы при «Стереть диск». Без этого Calamares называет его
# «root», и так он подписан в Dolphin («Устройства»). filesystem "unknown" —
# тип по умолчанию (defaultFileSystemType) или выбранный пользователем.
partitionLayout:
  - name: "Sedmio"
    filesystem: "unknown"
    mountPoint: "/"
    size: 100%

lvm:
  enable: false
