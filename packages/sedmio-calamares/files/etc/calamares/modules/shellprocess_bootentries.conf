# Пункты меню systemd-boot по постоянным именам ядер (см. bootentries.sh):
# пункты от kernel-install после обновления ядра указывали бы на старое.
# Запускается снаружи (dontChroot): скрипт живёт в live-образе.
---
dontChroot: true
timeout: 120
script:
  - "/usr/lib/sedmio/installer/bootentries.sh ${ROOT}"
i18n:
  name: "Настраиваем меню загрузки"
