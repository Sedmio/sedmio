# Переводчик меню GTK для глобального меню Plasma. Глобального меню у
# оболочки Sedmio нет (и модуль kded appmenu выключен, см. /etc/xdg/kded5rc) —
# процесс только занимал память. Работает, как в Plasma, если оболочки нет
# (пакет удалён) или выбран plasmashell (~/.config/sedmio/use-plasmashell).
[Unit]
ConditionPathExists=|!/usr/share/sedmio/shell/shell.qml
ConditionPathExists=|%h/.config/sedmio/use-plasmashell
