# Sedmio: панель и обои рисует sedmio-shell.service, plasmashell не нужен.
# Вернуть его: touch ~/.config/sedmio/use-plasmashell
[Unit]
ConditionPathExists=%h/.config/sedmio/use-plasmashell

[Service]
# Агент паролей Wi‑Fi из plasma-nm — для апплета сети plasmashell
# (при нашей оболочке не загружается, /etc/xdg/kded5rc).
ExecStartPre=-/usr/bin/busctl --user call org.kde.kded6 /kded org.kde.kded6 loadModule s networkmanagement
# Глобальное меню (виджет панели Plasma) — тоже выключено при нашей оболочке.
ExecStartPre=-/usr/bin/busctl --user call org.kde.kded6 /kded org.kde.kded6 loadModule s appmenu
