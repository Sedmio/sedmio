# Sedmio: пароль администратора спрашивает sedmio-shell.service (агент polkit
# в оболочке). Агент в сеансе может быть только один, поэтому KDE-шный не
# запускается. Вернуть его вместе с plasmashell: touch ~/.config/sedmio/use-plasmashell
[Unit]
ConditionPathExists=%h/.config/sedmio/use-plasmashell
