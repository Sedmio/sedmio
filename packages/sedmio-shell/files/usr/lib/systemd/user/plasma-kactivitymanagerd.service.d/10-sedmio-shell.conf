# Комнаты Plasma (activities) и учёт недавних файлов для них. Были нужны
# виджетам plasmashell; оболочка Sedmio, «Файлы» и KWin обходятся без них, а
# процесс занимал память и писал базу открытых файлов. Без него в запасных
# окнах KDE (выбор файла, Dolphin) не пополняются «Недавние файлы» и
# «Недавние места» (recentlyused:/). KWin зовёт службу по D-Bus — запуск
# не проходит по условию, KWin работает без комнат.
# Работает, если оболочки нет (пакет удалён).
[Unit]
ConditionPathExists=!/usr/share/sedmio/shell/shell.qml
