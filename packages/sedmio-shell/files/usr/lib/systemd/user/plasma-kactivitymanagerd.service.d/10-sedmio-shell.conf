# Комнаты Plasma (activities) и учёт недавних файлов для них. Нужны только
# виджетам plasmashell; оболочка Sedmio, «Файлы» и KWin обходятся без них, а
# процесс занимал память и писал базу открытых файлов. KWin зовёт службу по
# D-Bus — запуск не проходит по условию, KWin работает без комнат.
# Работает, как в Plasma, если оболочки нет (пакет удалён), выбран
# plasmashell (~/.config/sedmio/use-plasmashell) или наша упала и включена
# запасная (метка от sedmio-shell-fallback.service — до выхода из сеанса).
[Unit]
ConditionPathExists=|!/usr/share/sedmio/shell/shell.qml
ConditionPathExists=|%h/.config/sedmio/use-plasmashell
ConditionPathExists=|%t/sedmio/shell-fallback
