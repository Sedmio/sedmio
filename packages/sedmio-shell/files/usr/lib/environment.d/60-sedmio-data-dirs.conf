# Каталог Sedmio — первым в XDG_DATA_DIRS: файлы в нём перекрывают
# одноимённые из /usr/share, не трогая чужие пакеты. Сейчас там только
# клавиши KRunner (kglobalaccel/). Пусто или каталога нет — всё как
# обычно. Пакет sedmio-shell.
XDG_DATA_DIRS=/usr/share/sedmio/xdg:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
