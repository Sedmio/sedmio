# Выбор режима экранов (Meta+P, подключили второй экран) — наш, из
# «Параметров», вместо окна kscreen_osd_service. kded зовёт службу по
# D-Bus (org.kde.kscreen.osdService), мы отвечаем по тому же интерфейсу.
# Наше окно не загрузилось — работает прежний kscreen_osd_service.
[Service]
ExecStart=
ExecStart=/bin/sh -c '/usr/bin/sedmio-preferences --display-switcher || exec /usr/lib/kscreen_osd_service'
