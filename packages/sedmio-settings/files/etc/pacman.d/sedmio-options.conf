# Подключается из секции [options] в /etc/pacman.conf:
#   Include = /etc/pacman.d/sedmio-options.conf
# Сам /etc/pacman.conf принадлежит пакету pacman, поэтому строку Include
# добавляет установщик (и build-iso.sh для live-образа).
#
# Не распаковываем переводы и справку на других языках.
# Правило с ! исключает файл из запрета; последнее подходящее правило главнее.
# Действует только на новые установки и обновления пакетов.

# en@quot (английский с «кавычками») оставляем: без него не собирается
# ISO — mkarchiso вшивает его в GRUB (grub-mkstandalone --locales).
NoExtract = usr/share/locale/* !usr/share/locale/ru/* !usr/share/locale/locale.alias !usr/share/locale/en@quot/*
NoExtract = usr/share/help/* !usr/share/help/C/* !usr/share/help/ru/*
NoExtract = usr/share/qt6/translations/*.qm !usr/share/qt6/translations/*_ru.qm
NoExtract = usr/share/man/??/* usr/share/man/??_??/* !usr/share/man/ru/*

# Пункты меню, которые приезжают зависимостями и обычному пользователю не
# нужны. Сами программы остаются (на них завязаны KWin и ffmpeg), из меню
# пропадают: инструменты Qt (qt6-tools), схема процессора (hwloc),
# проверка веб-камеры (v4l-utils).
NoExtract = usr/share/applications/assistant.desktop usr/share/applications/designer.desktop
NoExtract = usr/share/applications/linguist.desktop usr/share/applications/qdbusviewer.desktop
NoExtract = usr/share/applications/lstopo.desktop
NoExtract = usr/share/applications/qv4l2.desktop usr/share/applications/qvidcap.desktop

# Панель выбора эмодзи Plasma (Meta+.): в Sedmio её нет совсем — ни
# программы, ни её модуля QML (больше никем не используется), ни словарей
# (~10 МБ). Пакет plasma-desktop остаётся: из него ещё нужны модули KDE.
NoExtract = usr/bin/plasma-emojier usr/share/applications/org.kde.plasma.emojier.desktop
NoExtract = usr/share/kglobalaccel/org.kde.plasma.emojier.desktop usr/share/plasma/emoji/*
NoExtract = usr/lib/qt6/qml/org/kde/plasma/emoji/* usr/share/locale/*/LC_MESSAGES/org.kde.plasma.emojier.mo
