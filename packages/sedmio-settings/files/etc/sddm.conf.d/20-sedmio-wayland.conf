# Экран входа на Wayland (KWin), а не на Xorg.
#
# На ПК две видеокарты: RTX 4060 (к ней подключены мониторы) и встроенная
# Radeon. Xorg берёт основной ту, что BIOS считает главной (часто Radeon),
# и рисует экран входа в её пустые разъёмы — мониторы остаются чёрными.
# KWin выводит изображение на все подключённые мониторы любой видеокарты.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
