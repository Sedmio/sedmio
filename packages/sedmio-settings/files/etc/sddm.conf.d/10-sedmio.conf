# Экран входа: тема Breeze из Plasma (пакет plasma-desktop) — тот же вид,
# обои и курсор, что на рабочем столе. Без этого SDDM берёт свою старую
# встроенную тему.
#
# Свою тему Sedmio для SDDM сделаем на этапе оформления (sedmio-branding).
# Настройки из «Параметры системы → Экран входа» пишутся в kde_settings.conf:
# этот файл читается позже нашего и имеет приоритет.
[Theme]
Current=breeze
CursorTheme=breeze_cursors
