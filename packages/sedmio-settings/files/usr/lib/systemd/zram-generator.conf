# Своп в сжатой памяти (zram-generator, docs/decisions.md): половина
# объёма памяти, сжатие zstd — обычно втрое, так что влезает больше, чем
# занимает. Диск не трогает и не изнашивает. Нужен и systemd-oomd: он
# следит за заполнением свопа (systemd/system/-.slice.d).
# Свои размеры — в /etc/systemd/zram-generator.conf (он главнее этого).
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
