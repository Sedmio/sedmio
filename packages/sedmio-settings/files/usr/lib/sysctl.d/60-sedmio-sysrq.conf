# Alt+PrtSc — снимок активного окна, как в Windows. Пока в ядре включены
# «волшебные» клавиши SysRq (в Arch по умолчанию 16 — из них работает
# только экстренная запись на диск Alt+SysRq+S), ядро перехватывает
# Alt+PrtSc (это и есть Alt+SysRq), и до программ оно не доходит.
# Вернуть: kernel.sysrq = 16 в /etc/sysctl.d/.
kernel.sysrq = 0
